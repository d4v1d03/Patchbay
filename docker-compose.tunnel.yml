# Public through a tunnel (Tailscale Funnel, Cloudflare Tunnel) from your own machine.
# The tunnel provides HTTPS; this adds the login and listens on localhost only.
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# Needs PATCHBAY_AUTH in .env (deploy/make-login.sh).

services:
  traefik:
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports: !override
      - "127.0.0.1:${TRAEFIK_PORT:-8088}:80"

  web:
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.middlewares=login
      - traefik.http.middlewares.login.basicauth.users=${PATCHBAY_AUTH:?run deploy/make-login.sh}
      - traefik.http.services.web.loadbalancer.server.port=8000
      - traefik.http.services.web.loadbalancer.healthcheck.path=/health
      - traefik.http.services.web.loadbalancer.healthcheck.interval=10s

  redis:
    restart: unless-stopped
    ports: !reset []
