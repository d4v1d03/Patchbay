{% extends "base.html" %}
{% block title %}{{ s.title }} — Patchbay{% endblock %}

{% block content %}
<section class="card session-head">
  <div class="head-main">
    <h1>{{ s.title }}</h1>
    <div class="meta">
      <span class="pill pill-{{ s.status }}" id="status">{{ s.status }}</span>
      <span class="muted">{{ s.model }} · prompt {{ s.prompt_version }}</span>
      <span class="muted" id="usage"></span>
    </div>
  </div>
  <div class="head-actions">
    <button class="btn" id="changes" type="button">Changes <span class="badge" id="diff-badge">{% if s.diff.files %}{{ s.diff.files }} · +{{ s.diff.insertions }} −{{ s.diff.deletions }}{% else %}0{% endif %}</span></button>
    <a class="btn" id="project" href="/sessions/{{ s.id }}/project.zip"{% if not project_ready %} hidden{% endif %}>Download project</a>
    <button class="btn" id="stop" type="button">Stop</button>
  </div>
</section>

<section class="timeline" id="timeline" aria-live="polite"></section>
<div class="thinking" id="thinking" hidden><span class="dot"></span> thinking…</div>
<button class="jump" id="jump" type="button" hidden>↓ new events</button>

<section class="card composer" id="composer">
  <textarea id="input" rows="3" placeholder="Send a follow-up, or answer the agent's question…"></textarea>
  <div class="form-row">
    <span class="muted" id="hint"></span>
    <button class="btn btn-primary" id="send" type="button">Send</button>
  </div>
</section>

<dialog id="diff" class="trace">
  <div class="trace-head">
    <strong id="diff-title">Changes</strong>
    <span>
      <a class="btn" id="diff-download" href="/sessions/{{ s.id }}/diff.patch" download>Download .patch</a>
      <button class="btn" id="diff-close" type="button">Close</button>
    </span>
  </div>
  <div id="diff-body" class="trace-body"></div>
</dialog>

<dialog id="trace" class="trace">
  <div class="trace-head">
    <strong id="trace-title">Step</strong>
    <button class="btn" id="trace-close" type="button">Close</button>
  </div>
  <div id="trace-body" class="trace-body"></div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
  window.SESSION = {{ s | tojson }};
  window.EVENTS = {{ events | tojson }};
</script>
<script src="/static/session.js"></script>
{% endblock %}
