<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Patchbay{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">⚓</span>
      <span class="brand-name">Patchbay</span>
    </a>
    <nav class="topnav">
      <a href="/#try">New task</a>
      <a href="/#sessions">Sessions</a>
      <a href="/docs" title="OpenAPI docs">API</a>
      <a href="/health" title="Dependency health">Health</a>
    </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    <span>Patchbay v{{ app_version }}</span>
    <span class="muted">model: {{ settings.llm_model or "not configured" }}</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
