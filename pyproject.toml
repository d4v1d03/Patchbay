[project]
name = "patchbay"
version = "0.1.0"
description = "Self-hosted AI coding agent that writes and tests code inside Docker sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "docker>=7.1",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "fakeredis>=2.38.0",
]

[tool.uv]
# Patchbay is an application, not a library: don't build/install it as a
# package, just run it from the repo root (which puts `patchbay/` on sys.path).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon (integration tests)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
