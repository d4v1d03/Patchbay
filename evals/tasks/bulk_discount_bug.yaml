    sys.path.insert(0, "/workspace")

    from inventory.catalog import Catalog
    from inventory.models import Item, Line, Order
    from inventory.pricing import line_total, order_total
    from inventory.reports import monthly_report


    def _cat():
        return Catalog([Item("A", "Widget", 1000, "tools"), Item("B", "Gadget", 250, "toys")])


    def test_bulk_discount_applied_once():
        assert order_total(Order("o1", [Line("A", 10)]), _cat()) == 9000


    def test_bulk_and_tier_stack_once():
        order = Order("o2", [Line("A", 10), Line("B", 4)], "gold")
        assert order_total(order, _cat()) == 9500  # (9000 + 1000) * 0.95


    def test_report_grand_total():
        orders = [Order("o1", [Line("A", 10)]), Order("o2", [Line("B", 2)], "silver")]
        assert monthly_report(orders, _cat())["grand_total_cents"] == 9490  # 9000 + 490


    def test_discount_rules_unchanged():
        assert line_total(100, 10) == 900 and line_total(100, 9) == 900
        assert line_total(250, 3) == 750
