# Public deployment on one VM: HTTPS from Let's Encrypt and a login in front.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Needs PATCHBAY_DOMAIN, ACME_EMAIL and PATCHBAY_AUTH in .env (deploy/README.md).

services:
  traefik:
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  web:
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${PATCHBAY_DOMAIN:?set PATCHBAY_DOMAIN in .env}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.routers.web.middlewares=login
      - traefik.http.middlewares.login.basicauth.users=${PATCHBAY_AUTH:?run deploy/make-login.sh}
      - traefik.http.services.web.loadbalancer.server.port=8000
      - traefik.http.services.web.loadbalancer.healthcheck.path=/health
      - traefik.http.services.web.loadbalancer.healthcheck.interval=10s

  redis:
    restart: unless-stopped
    ports: !reset []  # never on a public interface

volumes:
  letsencrypt:
